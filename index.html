<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astral Time Limited | Dealer Portal</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <!-- Azure Face API 密钥将通过环境变量注入 -->
</head>
<body>
    <div class="container">
        <header>
            <h1>Astral Time Limited</h1>
            <div class="ip-info" id="ipDisplay">Detecting your location...</div>
        </header>

        <main>
            <div class="btn-group">
                <button id="dealerBtn" class="btn-primary">Dealer Application</button>
                <button id="investorBtn" class="btn-secondary">Investor Portal</button>
            </div>

            <div class="usdt-rate">
                <p>Current USDT/MYR: <span id="exchangeRate">4.72</span></p>
            </div>
        </main>

        <div id="faceModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Identity Verification</h2>
                <div class="camera-box">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                </div>
                <button id="captureBtn" class="btn-primary">Verify Face</button>
                <p id="verificationStatus"></p>
            </div>
        </div>
    </div>

    <footer>
        <p>Copyright © 2025 Astral Time Limited. All rights reserved.</p>
    </footer>

    <script src="/assets/js/ip-tracker.js"></script>
    <script src="/assets/js/face-auth.js"></script>
</body>
</html>
